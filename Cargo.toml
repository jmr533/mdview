[package]
name = "mdview"
version = "0.1.0"
description = "A fast, lightweight GitHub-style Markdown viewer"
license = "MIT"
edition = "2024"

[dependencies]
comrak = { version = "0.56.0", default-features = false, features = ["syntect", "shortcodes"] }
gtk = "0.18"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
notify = "8.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
